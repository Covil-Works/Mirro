[package]
name = "mirro"
version = "0.1.0"
edition = "2021"
description = "Gerenciador nativo e espelhamento de dispositivos Android via scrcpy e Slint"
authors = ["Mirro Team"]

[dependencies]
slint = "1.18.1"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "process", "time", "macros", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
slint-build = "1.18.1"
